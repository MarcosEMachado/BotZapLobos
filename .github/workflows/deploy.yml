name: Deploy para VM

on:
  push:
    branches:
      - main  # Substitua pela branch que deseja monitorar

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v3

    - name: Configurar SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "144.22.196.120 ssh-rsa  toicmarcos@gmail.com" >> ~/.ssh/known_hosts

    - name: Deploy na VM
      run: |
        ssh -v -tt ubuntu@144.22.196.120 << 'EOF'
        cd fontes/BotZapLobos/
        git pull origin main
        npm install
        pm2 stop all || true
        pm2 start npm --name "BotZap" -- run start
        EOF